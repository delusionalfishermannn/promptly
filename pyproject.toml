[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promptfoundry"
version = "0.1.0"
description = "Continuous, evidence-driven discovery and production of original prompt products"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "PromptFoundry" }]
keywords = ["prompts", "prompt-engineering", "market-intelligence", "evaluation", "governance"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "alembic>=1.13",
    "celery>=5.4",
    "redis>=5.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "jsonschema>=4.22",
    "python-multipart>=0.0.9",
    "prometheus-client>=0.20",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]
postgres = ["pgvector>=0.2.5"]

[project.scripts]
promptfoundry = "backend.main:app"

[tool.setuptools.packages.find]
include = [
    "backend*", "connectors*", "core*", "db*", "evaluation*", "experimentation*",
    "governance*", "llm*", "market_intel*", "observability*", "prompt_ir*",
    "prompt_lab*", "publishing*", "workers*",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
    "ignore::DeprecationWarning:fastapi.*",
]
markers = [
    "slow: exercises the full pipeline (kept few so `make test` stays fast)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]
exclude = [".venv", "var", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "RUF", "ASYNC", "S"]
ignore = [
    "E501",   # long strings in prompt templates are intentional
    "S101",   # asserts are used in tests
    "S324",   # blake2b for non-cryptographic bucketing is intentional
    "RUF001", # en-dashes in product copy
    "RUF002",
    "RUF003",
    "B008",   # FastAPI Depends() in defaults is the documented pattern
    "S311",   # randomness is seeded statistical simulation (bootstrap/bandits), not crypto
    "RUF046", # explicit int() on numeric config/DB values is deliberate defensiveness
    "RUF005", # list concatenation reads better than unpacking in these spots
    "RUF007", # pairwise() would obscure the zip() intent in embedding/cluster code
    "C416",   # dict(...) vs comprehension is a wash; keep the explicit form
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]
"demo/*" = ["S311", "S105", "S106"]
"alembic/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = false
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = false
exclude = "alembic"
