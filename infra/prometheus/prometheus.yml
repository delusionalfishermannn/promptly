global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    service: promptfoundry

scrape_configs:
  - job_name: promptfoundry-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
